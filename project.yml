# Xcode project definition. Generate the .xcodeproj with:  xcodegen generate
name: ComicReader
options:
  bundleIdPrefix: com.zach
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # FREE_ACCOUNT=1 xcodegen generate  builds without iCloud, for signing with a free Apple ID.
  postGenCommand: scripts/post-generate.sh
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
packages:
  ComicKit:
    path: Packages/ComicKit
targets:
  ComicReader:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: ComicKit
        product: ComicCore
      - package: ComicKit
        product: ArchiveKit
      - package: ComicKit
        product: LibraryKit
      - target: ComicThumbnails
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Comic Reader
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        # Comic archive types, so the thumbnail extension can claim them in the Files app.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.zach.comicreader.cbz
            UTTypeDescription: Comic Book (ZIP)
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [cbz]
              public.mime-type: [application/vnd.comicbook+zip, application/x-cbz]
          - UTTypeIdentifier: com.zach.comicreader.cbr
            UTTypeDescription: Comic Book (RAR)
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [cbr]
              public.mime-type: [application/vnd.comicbook-rar, application/x-cbr]
          - UTTypeIdentifier: com.zach.comicreader.cb7
            UTTypeDescription: Comic Book (7z)
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [cb7]
              public.mime-type: [application/x-cb7]
          - UTTypeIdentifier: com.zach.comicreader.cbt
            UTTypeDescription: Comic Book (TAR)
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [cbt]
              public.mime-type: [application/x-cbt]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSUbiquitousContainers:
          iCloud.com.zach.comicreader:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Comic Reader
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: App/ComicReader.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.zach.comicreader
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.zach.comicreader
        com.apple.developer.icloud-services:
          - CloudDocuments
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zach.comicreader
        PRODUCT_NAME: ComicReader
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  # Quick Look thumbnail extension: real covers for comic archives in the Files app.
  ComicThumbnails:
    type: app-extension
    platform: iOS
    sources:
      - path: ThumbnailExtension
        excludes:
          - Info.plist
    dependencies:
      - package: ComicKit
        product: ComicCore
      - package: ComicKit
        product: ArchiveKit
      - sdk: QuickLookThumbnailing.framework
    info:
      path: ThumbnailExtension/Info.plist
      properties:
        CFBundleDisplayName: Comic Reader Thumbnails
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - com.zach.comicreader.cbz
              - com.zach.comicreader.cbr
              - com.zach.comicreader.cb7
              - com.zach.comicreader.cbt
            QLThumbnailMinimumDimension: 0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zach.comicreader.thumbnails
        PRODUCT_NAME: ComicThumbnails
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  ComicReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: ComicReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zach.comicreader.uitests
        TEST_TARGET_NAME: ComicReader
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ComicReader:
    build:
      targets:
        ComicReader: all
        ComicReaderUITests: [test]
    test:
      targets:
        - ComicReaderUITests
